# Optional convenience orchestrator.
# Every service still has its own Dockerfile and can be built/run standalone -
# nothing here is shared between services except the external cloud MySQL and
# CloudAMQP instances.
services:
  api-gateway:
    build: ./api-gateway
    image: sporthub/api-gateway
    container_name: sporthub-api-gateway
    env_file: ./api-gateway/.env
    environment:
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:9000
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports: ["8080:8080"]
    restart: unless-stopped
    networks: [sporthub]

  inventory-service:
    build: ./inventory-service
    image: sporthub/inventory-service
    container_name: sporthub-inventory-service
    env_file: ./inventory-service/.env
    ports: ["9000:9000"]
    restart: unless-stopped
    networks: [sporthub]

  analytics-service:
    build: ./analytics-service
    image: sporthub/analytics-service
    container_name: sporthub-analytics-service
    env_file: ./analytics-service/.env
    ports: ["8000:8000"]
    restart: unless-stopped
    networks: [sporthub]

  notification-service:
    build: ./notification-service
    image: sporthub/notification-service
    container_name: sporthub-notification-service
    env_file: ./notification-service/.env
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports: ["7000:7000"]
    restart: unless-stopped
    networks: [sporthub]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_AUTH_DEV_BYPASS: "true"
    image: sporthub/frontend
    container_name: sporthub-frontend
    ports: ["5173:80"]
    depends_on: [api-gateway]
    restart: unless-stopped
    networks: [sporthub]

networks:
  sporthub:
    driver: bridge
